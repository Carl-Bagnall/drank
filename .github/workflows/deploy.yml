name: Deploy to production

# Only main deploys to production. Everything else goes to staging via
# preview.yml, against a separate database.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      # Never two production deploys at once. Cancelling an in-flight one is
      # safe here because a deploy is a single atomic upload.
      group: deploy-production
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # worker-configuration.d.ts is derived from wrangler.jsonc and is
      # git-ignored, so it has to be generated before anything type-checks.
      - run: npx wrangler types

      # The gate. A broken build or a failing test must not reach production,
      # so these run before any deploy step rather than alongside it.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Migrations run before the code that depends on them. Applied
      # separately from the deploy so a migration failure stops the release
      # rather than leaving new code against an old schema.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply drank --remote

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c dist/drank/wrangler.json

      - name: Summarise
        run: |
          {
            echo "## Deployed to production"
            echo ""
            echo "https://drank.carlbagnall.workers.dev"
          } >> "$GITHUB_STEP_SUMMARY"
