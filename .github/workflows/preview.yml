name: Deploy preview to staging

# Every branch except main deploys to one shared staging Worker, so the
# preview always lives at the same URL:
#   https://staging-drank.carlbagnall.workers.dev
#
# Staging has its own D1 database. That is the point: a preview branch can run
# migrations and write rows without touching real accounts or real ratings.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  preview:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx wrangler types
      - run: npm run typecheck
      - run: npm test

      # The Cloudflare Vite plugin reads CLOUDFLARE_ENV and resolves the
      # wrangler environment at build time, writing the deployable config into
      # dist/. Passing `--env` to `wrangler deploy` instead does not work here:
      # the plugin owns `assets.directory`, so the source config alone is not
      # deployable.
      - name: Build for staging
        env:
          CLOUDFLARE_ENV: staging
        run: npm run build

      - name: Apply D1 migrations to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply drank-staging --env staging --remote

      # The generated config already names staging-drank and the staging
      # database, because the build above resolved the environment.
      - name: Deploy to staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy -c dist/drank/wrangler.json

      - name: Summarise
        run: |
          {
            echo "## Staging preview"
            echo ""
            echo "Branch: \`${GITHUB_REF_NAME}\`"
            echo ""
            echo "https://staging-drank.carlbagnall.workers.dev"
            echo ""
            echo "_One shared staging Worker, overwritten by each preview push._"
            echo "_It uses the \`drank-staging\` database, never production._"
          } >> "$GITHUB_STEP_SUMMARY"
